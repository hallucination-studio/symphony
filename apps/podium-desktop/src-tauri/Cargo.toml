[package]
name = "symphony-podium-desktop"
version = "0.1.0"
description = "Symphony Podium Desktop static shell"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
libc = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "default-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.1", features = ["macos-private-api"] }
